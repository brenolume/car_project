{% extends "base.html" %}

{% block content %}
  <style>
    .card {
      max-width: 480px;
      margin: 60px auto 0;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 30px 32px;
      text-align: center;
      color: #fff;
    }

    .card-title {
      margin: 0 0 16px 0;
      font-size: 1.6rem;
    }

    .card-body p {
      color: var(--text-soft);
      line-height: 1.6;
    }

    .card-body strong {
      color: #fff;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(to right, var(--raasch-blue), var(--raasch-blue-dark));
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
      margin: 0 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #d9534f;
      text-decoration: none !important;
    }

    .btn-danger:hover {
      background: #d2221c;
    }

    .error-message {
      color: #d9534f;
      font-size: 14px;
      margin-top: 5px;
    }

    a {
      text-decoration: none !important;
    }
  </style>
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Deletar Carro</h1>
    </div>
    <div class="card-body">
      <p>Tem certeza que deseja deletar o carro <strong>{{ object.brand }} {{ object.model }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="buttons-container">
          <button type="submit" class="btn btn-danger">Deletar Carro</button>
          <a href="{% url 'car_update' pk=object.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
