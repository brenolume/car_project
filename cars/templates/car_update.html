{% extends "base.html" %}

{% block content %}

  <style>
    form {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 30px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 16px;
    }

    form h1 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }

    th, td {
      padding: 4px;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-soft);
    }

    th {
      background-color: transparent;
      font-weight: 600;
    }

    input[type="text"], input[type="number"], select, textarea {
      padding: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: #fff;
      width: 100%;
      max-width: 300px;
      margin-bottom: 8px;
      transition: border-color 0.3s ease-in-out;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--raasch-gold);
    }

    select option {
      background: var(--raasch-navy);
      color: #fff;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(to right, var(--raasch-blue), var(--raasch-blue-dark));
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
      margin: 0 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #d9534f;
      text-decoration: none !important;
    }

    .btn-danger:hover {
      background: #d2221c;
    }

    .error-message {
      color: #d9534f;
      font-size: 14px;
      margin-top: 5px;
    }

    a {
      text-decoration: none !important;
    }

  </style>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Editar Carro</h1>
    <table>
      {{ form.as_table }}
    </table>
    <div>
      <div class="buttons-container">
        <input type="submit" value="Salvar Alterações" class="btn btn-primary">
        <a href="{% url 'car_delete' pk=object.pk %}" class="btn btn-danger">Deletar Carro</a>
        <a href="{% url 'cars_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </div>
  </form>
{% endblock %}
