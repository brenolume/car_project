{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/media/img/logo_raasch.jpg">

  <title>{% block title %}Raasch Veículos{% endblock %}</title>

  <style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        min-height: 100%;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #ffffff;
        background-color: #111111;
        background-image: url('/media/img/logo_raasch.jpg');
        background-size: min(430px, 70vw) auto;
        background-repeat: no-repeat;
        background-position: center;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at center, rgba(0, 150, 199, 0.20), transparent 32%),
            linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.78));
        z-index: -2;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        width: min(520px, 82vw);
        height: min(520px, 82vw);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(0, 150, 199, 0.38);
        border-radius: 50%;
        box-shadow:
            0 0 35px rgba(0, 150, 199, 0.30),
            inset 0 0 45px rgba(0, 150, 199, 0.18);
        z-index: -1;
        pointer-events: none;
    }

    .header {
        width: 100%;
        min-height: 72px;
        background: linear-gradient(90deg, #0077a3, #0096c7, #0077a3);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 30px;
        position: relative;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        z-index: 10;
    }

    .site-title {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    .menu-container {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
    }

    .menu-button {
        background-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 8px;
        font-size: 16px;
        transition: 0.2s ease;
    }

    .menu-button:hover {
        background-color: rgba(255, 255, 255, 0.25);
    }

    .menu-options {
        display: none;
        position: absolute;
        left: 0;
        top: 48px;
        min-width: 210px;
        background-color: rgba(20, 20, 20, 0.96);
        border: 1px solid rgba(0, 150, 199, 0.55);
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        z-index: 1000;
    }

    .menu-options.active {
        display: block;
    }

    .menu-options ul {
        list-style: none;
        margin: 0;
        padding: 6px 0;
    }

    .menu-options li {
        margin: 0;
    }

    .menu-options a {
        display: block;
        color: #ffffff;
        text-decoration: none;
        padding: 13px 16px;
        font-size: 15px;
        transition: 0.2s ease;
    }

    .menu-options a:hover {
        background-color: #0096c7;
        padding-left: 22px;
    }

    main {
        flex: 1;
        width: min(1100px, calc(100% - 32px));
        margin: 35px auto;
        padding: 25px;
        background-color: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.30);
        backdrop-filter: blur(4px);
    }

    footer {
        background: linear-gradient(90deg, #0077a3, #0096c7, #0077a3);
        color: #ffffff;
        padding: 18px;
        text-align: center;
        box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.25);
        z-index: 10;
    }

    footer p {
        margin: 0;
    }

    @media (max-width: 600px) {
        .header {
            min-height: 82px;
            padding: 0 15px;
        }

        .site-title {
            font-size: 20px;
        }

        .menu-container {
            left: 12px;
        }

        .menu-button {
            padding: 8px 11px;
            font-size: 14px;
        }

        main {
            width: calc(100% - 20px);
            margin: 22px auto;
            padding: 18px;
        }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="menu-container">
      <button class="menu-button" type="button" onclick="toggleMenu()">
        ☰ Menu
      </button>

      <nav class="menu-options" id="menuOptions">
        <ul>
          <li>
            <a href="{% url 'cars_list' %}">Veículos</a>
          </li>

          <li>
            <a href="{% url 'new_car' %}">Vender</a>
          </li>

          <li>
            <a href="#">Financiar</a>
          </li>

          <li>
            <a href="#">Ajuda</a>
          </li>
        </ul>
      </nav>
    </div>
    
    <a href='/cars/'><h1 class="site-title">Raasch Veículos</h1></a>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    <p>&copy; 2026 Raasch Veículos</p>
  </footer>

  <script>
    function toggleMenu() {
        const menu = document.getElementById("menuOptions");
        menu.classList.toggle("active");
    }

    document.addEventListener("click", function(event) {
        const menu = document.getElementById("menuOptions");
        const button = document.querySelector(".menu-button");

        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.classList.remove("active");
        }
    });
  </script>
</body>
</html>
