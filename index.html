<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Oficial</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #05070a;
            --bg-card: rgba(15, 23, 42, 0.55);
            --bg-card-hover: rgba(30, 41, 59, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.45);
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 64px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Grid & Ambient Glow */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(circle at 50% 20%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 20%, black 20%, transparent 80%);
            z-index: -2;
            pointer-events: none;
        }

        .ambient-orb {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            height: 320px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 75%);
            filter: blur(45px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Profile Header */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-cyan), rgba(59, 130, 246, 0.2));
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.25);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #0f172a;
            display: block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent-cyan);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .profile-name {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .profile-handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            margin-top: -6px;
        }

        .profile-bio {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 380px;
        }

        /* Social Row */
        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.22s ease;
            backdrop-filter: blur(12px);
        }

        .social-btn:hover {
            color: var(--accent-cyan);
            border-color: var(--border-glow);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.15);
        }

        /* Browser Tip Banner */
        .browser-tip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .browser-tip i {
            color: var(--accent-cyan);
            flex-shrink: 0;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border-subtle), transparent);
        }

        /* Affiliate Products Grid */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(14px);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            border-color: var(--border-glow);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.22);
        }

        .product-img-box {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(5, 7, 10, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .product-old-price {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .card-arrow {
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
            flex-shrink: 0;
        }

        .product-card:hover .card-arrow,
        .link-card:hover .card-arrow {
            color: var(--accent-cyan);
            transform: translateX(3px);
        }

        /* General Links */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 18px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(14px);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .link-card.featured {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(15, 23, 42, 0.75));
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
        }

        .link-card:hover {
            border-color: var(--border-glow);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px -10px rgba(56, 189, 248, 0.2);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            flex-shrink: 0;
        }

        .link-card.featured .link-icon {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .link-text {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .link-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Footer */
        footer {
            margin-top: 24px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="ambient-orb"></div>

    <main class="container">
        <!-- Perfil -->
        <header class="profile">
            <div class="avatar-wrapper">
                <img id="profile-img" src="" alt="Foto de Perfil">
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text"></span>
            </div>
            <h1 class="profile-name" id="profile-name"></h1>
            <p class="profile-handle" id="profile-handle"></p>
            <p class="profile-bio" id="profile-bio"></p>
            <div class="socials" id="socials-container"></div>
        </header>

        <!-- Dica para navegador interno do Instagram -->
        <div class="browser-tip">
            <i data-lucide="sparkles" size="18"></i>
            <span>Observação: Os cupons são aplicados <strong>automaticamente</strong> após clicar no produto selecionado.</span>
        </div>

        <!-- Vitrine de Afiliados -->
        <section id="products-section">
            <div class="section-header">
                <span class="section-title">Meus Produtos</span>
                <div class="section-line"></div>
            </div>
            <div class="products-list" id="products-container"></div>
        </section>

        <!-- Links Gerais -->
        <section id="links-section">
            <div class="section-header">
                <span class="section-title">Acesso Rápido</span>
                <div class="section-line"></div>
            </div>
            <div class="links-list" id="links-container"></div>
        </section>

        <footer id="footer-text"></footer>
    </main>

    <script>
        // =====================================================================
        // EDITE APENAS ESTE BLOCO COM AS SUAS INFORMAÇÕES, LINKS E PRODUTOS
        // =====================================================================
        const CONFIG = {
            perfil: {
                foto: "./images/my_foto.jpeg", // Substitua pela URL da sua foto ou "./perfil.jpg"
                nome: "Lume",
                arroba: "@brenolume",
                bio: "Curadoria diária de eletrônicos, periféricos, utilidades para casa e acessórios para carro, moto e bike elétrica. Só o que entrega custo-benefício real.",
                statusOnline: true,
                textoStatus: "Links Atualizados"
            },
            redesSociais: [
                {
                    nome: "Instagram", 
                    svg: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>`,
                    url: "https://www.instagram.com/brenolume?evlk=MXhlZjlvNHl1aml4NQ==" 
                },
                {
                    nome: "Threads", 
                    svg: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 0-7 7c4.5 0 7-2.5 7-6.5V11a5 5 0 0 0-5-5c-2.5 0-4.5 1.8-4.5 4.2 0 2.3 1.7 4 4 4 2.1 0 3.5-1.4 3.5-3.4V9.5"/><path d="M12 19c-4.5 0-7.5-3.2-7.5-7.5S7.5 4 12 4c4.2 0 7.2 2.8 7.5 7"/></svg>`, 
                    url: "https://www.threads.com/@brenolume" 
                }
            ],
            produtosAfiliados: [
                {
                    titulo: "Capacete Asx City - Preto Fosco",
                    subtitulo: "Frete Grátis ° Mais Vendidos",
                    precoAntigo: "R$ 599,00",
                    preco: "R$436,17",
                    imagem: "./images/capacete.jpeg",
                    url: "https://meli.la/2KhLJdv",
                    tag: ""
                },
                {
                    titulo: "Garrafa Térmica Nórdica 1l",
                    subtitulo: "Frete Gratis ° Mais Vendidos",
                    preco: "R$ 54,99",
                    imagem: "./images/garrafa_nordica.jpeg",
                    url: "https://meli.la/1uG6juQ",
                    tag: "Luxo"
                }
            ],
            linksGerais: [
                {
                    titulo: "Contato & Parcerias",
                    subtitulo: "Fale diretamente comigo",
                    icone: "send",
                    url: "https://web.whatsapp.com/",
                    destaque: true
                }
            ],
            rodape: "© 2026 • Todos os direitos reservados"
        };
        // =====================================================================

        function renderPage() {
            // Perfil
            document.getElementById('profile-img').src = CONFIG.perfil.foto;
            document.getElementById('profile-name').textContent = CONFIG.perfil.nome;
            document.getElementById('profile-handle').textContent = CONFIG.perfil.arroba;
            document.getElementById('profile-bio').textContent = CONFIG.perfil.bio;
            document.getElementById('footer-text').textContent = CONFIG.rodape;

            const statusBadge = document.getElementById('status-badge');
            if (CONFIG.perfil.statusOnline) {
                document.getElementById('status-text').textContent = CONFIG.perfil.textoStatus;
            } else {
                statusBadge.style.display = 'none';
            }

            // Redes Sociais
            const socialsContainer = document.getElementById('socials-container');
            CONFIG.redesSociais.forEach(rede => {
                const a = document.createElement('a');
                a.href = rede.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'social-btn';
                a.setAttribute('aria-label', rede.nome);
                a.innerHTML = rede.svg;
                socialsContainer.appendChild(a);
            });

            // Produtos Afiliados
            const productsContainer = document.getElementById('products-container');
            if (!CONFIG.produtosAfiliados || CONFIG.produtosAfiliados.length === 0) {
                document.getElementById('products-section').style.display = 'none';
            } else {
                CONFIG.produtosAfiliados.forEach(prod => {
                    const a = document.createElement('a');
                    a.href = prod.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = 'product-card';
                    a.innerHTML = `
                        <div class="product-img-box">
                            <img src="${prod.imagem}" alt="${prod.titulo}">
                            ${prod.tag ? `<span class="product-tag">${prod.tag}</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-title">${prod.titulo}</div>
                            <div class="product-sub">${prod.subtitulo}</div>
                            <div class="product-price">
                                ${prod.precoAntigo ? `<span class="product-old-price">De ${prod.precoAntigo}</span> para ` : ''}${prod.preco}
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="card-arrow" size="18"></i>
                    `;
                    productsContainer.appendChild(a);
                });
            }

            // Links Gerais
            const linksContainer = document.getElementById('links-container');
            if (!CONFIG.linksGerais || CONFIG.linksGerais.length === 0) {
                document.getElementById('links-section').style.display = 'none';
            } else {
                CONFIG.linksGerais.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = `link-card ${link.destaque ? 'featured' : ''}`;
                    a.innerHTML = `
                        <div class="link-icon">
                            <i data-lucide="${link.icone}" size="20"></i>
                        </div>
                        <div class="link-text">
                            <div class="link-title">${link.titulo}</div>
                            ${link.subtitulo ? `<div class="link-sub">${link.subtitulo}</div>` : ''}
                        </div>
                        <i data-lucide="arrow-up-right" class="card-arrow" size="18"></i>
                    `;
                    linksContainer.appendChild(a);
                });
            }

            // Inicializa ícones Lucide
            lucide.createIcons();
        }

        renderPage();
    </script>
</body>
</html>
